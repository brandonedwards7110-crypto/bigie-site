<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bigie's Venture Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --board-deep: #0e1912; --chalk: #f2f0e6; --chalk-dim: #c9cabb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background-color: var(--board-deep);
    color: var(--chalk);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    display: flex; flex-direction: column;
  }
  a { color: inherit; }

  nav {
    position: sticky; top: 0; z-index: 40; background: rgba(12,10,13,0.88); backdrop-filter: blur(6px);
    padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(245,241,238,0.08);
  }
  .nav-brand { font-family: "Caveat", cursive; font-size: 1.3rem; letter-spacing: 0.02em; text-decoration: none; }

  .nav-menu { position: relative; }
  .nav-menu-trigger { cursor: pointer; list-style: none; display: flex; align-items: center; padding: 4px; }
  .nav-menu-trigger::-webkit-details-marker { display: none; }
  .nav-menu-icon { display: flex; flex-direction: column; gap: 4px; width: 20px; }
  .nav-menu-icon span { display: block; height: 2px; background: var(--chalk); border-radius: 1px; }
  .nav-menu-panel {
    position: absolute; top: calc(100% + 10px); right: 0; min-width: 230px;
    background: var(--board-deep); border: 1px solid rgba(245,241,238,0.14); border-radius: 12px;
    padding: 8px; display: flex; flex-direction: column; gap: 2px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.55); z-index: 60;
  }
  .nav-menu-panel a { display: block; padding: 10px 12px; border-radius: 8px; font-size: 0.88rem; text-decoration: none; color: var(--chalk); }
  .nav-menu-panel a:hover { background: rgba(245,241,238,0.06); }
  .nav-submenu > summary {
    display: flex; align-items: center; justify-content: space-between; list-style: none; cursor: pointer;
    padding: 10px 12px; border-radius: 8px; font-size: 0.88rem; color: var(--chalk);
  }
  .nav-submenu > summary::-webkit-details-marker { display: none; }
  .nav-submenu > summary:hover { background: rgba(245,241,238,0.06); }
  .nav-submenu > summary::after { content: '\203A'; color: var(--chalk-dim); transition: transform 0.15s ease; }
  .nav-submenu[open] > summary::after { transform: rotate(90deg); }
  .nav-submenu-panel { padding-left: 10px; display: flex; flex-direction: column; gap: 2px; margin: 2px 0 4px; }
  .nav-submenu-panel a { font-size: 0.82rem; color: var(--chalk-dim); padding: 8px 12px; }
  .nav-menu-divider { height: 1px; background: rgba(245,241,238,0.1); margin: 6px 4px; }
  .nav-menu-powered { color: var(--rose, #f0a99c) !important; font-weight: 600; }

  /* the chalkboard hero -- final image, everything already drawn in.
     board-inner locks to the photo's own aspect ratio and scales to fit
     any screen with zero cropping/distortion; the blurred copy behind it
     fills the letterboxing instead of leaving flat dark space. */
  .board-wrap {
    position: relative; flex: 1; min-height: 0;
    background-color: var(--board-deep);
    overflow: hidden;
  }
  .board-wrap::before {
    content: ''; position: absolute; inset: -30px; z-index: 0;
    background-image: url('assets/chalkboard-hero.png');
    background-size: cover; background-position: center; background-repeat: no-repeat;
    filter: blur(32px) brightness(0.4) saturate(1.05);
    transform: scale(1.15);
  }
  .board-inner {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    aspect-ratio: 1716 / 916;
    width: 100%; max-width: 100%; max-height: 100%;
    z-index: 1;
    background-image: url('assets/chalkboard-hero.png');
    background-size: cover; background-position: center; background-repeat: no-repeat;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  /* Five clickable hotspots, positioned to match the drawn boxes in the
     image itself -- invisible, no visual styling of their own, just a
     hover cue so it's clear they're real links. */
  .hotspot {
    position: absolute; display: block;
    border-radius: 8%;
    transition: background-color 0.15s ease;
  }
  .hotspot:hover, .hotspot:focus-visible {
    background-color: rgba(242,240,230,0.08);
    outline: none;
  }
  .hotspot-bigie       { left: 6.5%;  top: 25.4%; width: 20.5%; height: 22.9%; }
  .hotspot-bigie-lite  { left: 33.7%; top: 25.8%; width: 21.3%; height: 22.4%; }
  .hotspot-car-riders  { left: 7%;    top: 61.2%; width: 20.5%; height: 22.1%; }
  .hotspot-web-design  { left: 34.1%; top: 60.7%; width: 21%;   height: 22.6%; }

  footer {
    text-align: center; padding: 16px 24px; color: rgba(245,241,238,0.35); font-size: 0.78rem;
  }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/">powered by bigie</a>
  <details class="nav-menu">
    <summary class="nav-menu-trigger"><span class="nav-menu-icon"><span></span><span></span><span></span></span></summary>
    <div class="nav-menu-panel">
      <a href="https://app.bigie.us/">Bigie</a>
      <a href="https://lite.bigie.us/">Bigie Lite</a>
      <a href="https://carriders.bigie.us/">Car Riders</a>
      <a href="/web-design/">Web Design</a>
      <details class="nav-submenu">
        <summary>Clients</summary>
        <div class="nav-submenu-panel">
          <a href="/web-design/elements-salon/">Elements Salon</a>
          <a href="/web-design/made-by-madison/">Made by Madison</a>
        </div>
      </details>
      <div class="nav-menu-divider"></div>
      <a href="https://bigie.us/" class="nav-menu-powered">Powered by Bigie</a>
    </div>
  </details>
</nav>

<div class="board-wrap">
    <div class="board-inner">
      <a class="hotspot hotspot-bigie" href="https://app.bigie.us/" aria-label="Bigie — live now"></a>
      <a class="hotspot hotspot-bigie-lite" href="https://lite.bigie.us/" aria-label="Bigie Lite — live now"></a>
      <a class="hotspot hotspot-car-riders" href="https://carriders.bigie.us/" aria-label="Car Riders — school pickup"></a>
      <a class="hotspot hotspot-web-design" href="/web-design/" aria-label="Web Design — real sites, built"></a>
    </div>
</div>

<footer>bigie.us</footer>

</body>
</html>
