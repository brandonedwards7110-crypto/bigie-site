<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bigie's Venture Studio</title>
<style>
  :root { --chalk: #f2f0e6; --board-deep: #0e1912; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--board-deep);
  }
  a { color: inherit; }

  /* The chalkboard photo IS the page -- nothing above it, below it, or
     beside it. Fills the viewport edge to edge, cropping instead of
     leaving dark space on a mismatched screen ratio. Two images: a
     wide one for normal/wide windows, a tall purpose-built one that
     swaps in under the width breakpoint below (narrow desktop window,
     tablet, phone -- any narrow screen, regardless of its aspect
     ratio) -- since each image is shaped for its own context, actual
     cropping should be minor in practice. Hotspots are positioned in
     JS against whichever image is actually showing, using its real
     on-screen crop geometry. */
  .board-photo {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    object-fit: cover; object-position: center;
    display: block;
  }
  .board-photo.wide { display: block; }
  .board-photo.tall { display: none; }

  .hotspot { position: fixed; display: block; }
  .hotspot.tall-only { display: none; }
  .hotspot:hover, .hotspot:focus-visible {
    background-color: rgba(242,240,230,0.08);
    outline: none;
  }

  /* the dropdown menu -- a hand-drawn chalk squiggle standing in for a
     hamburger icon, sitting right on the board itself */
  .menu-hotspot {
    position: fixed; display: flex; align-items: center; justify-content: center;
    background: none; border: none; padding: 0; cursor: pointer;
  }
  .chalk-squiggle { width: 70%; height: 70%; opacity: 0.9; }
  .chalk-squiggle path {
    fill: none; stroke: var(--chalk); stroke-width: 2.2; stroke-linecap: round;
  }

  .menu-panel {
    position: fixed; z-index: 50;
    min-width: 210px;
    background: #0e1912; border: 1px solid rgba(245,241,238,0.16); border-radius: 12px;
    padding: 8px; display: flex; flex-direction: column; gap: 2px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.55);
  }
  .menu-panel[hidden] { display: none; }
  .menu-panel a {
    display: block; padding: 10px 12px; border-radius: 8px; font-size: 0.9rem;
    text-decoration: none; color: var(--chalk);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .menu-panel a:hover { background: rgba(245,241,238,0.08); }
  .menu-submenu { padding-left: 12px; display: flex; flex-direction: column; gap: 2px; }
  .menu-submenu-label {
    padding: 8px 12px 2px; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: #c9cabb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .menu-submenu a { font-size: 0.84rem; color: #c9cabb; }

  /* Pure width breakpoint, not aspect ratio -- a narrowed desktop
     browser window gets this exactly like a phone or tablet does. */
  @media (max-width: 820px) {
    .board-photo.wide { display: none; }
    .board-photo.tall { display: block; }
    .hotspot.wide-only { display: none; }
    .hotspot.tall-only { display: block; }
  }

</style>
</head>
<body>

<img class="board-photo wide" src="assets/chalkboard-hero.png" alt="Bigie's Venture Studio chalkboard, with Bigie, Bigie Lite, Car Riders, and Web Design each in their own drawn box">
<img class="board-photo tall" src="assets/chalkboard-vertical.png" alt="Bigie's Venture Studio chalkboard, vertical layout, with Bigie, Bigie Lite, Car Riders, and Web Design each in their own drawn box">

<!-- wide (landscape / normal window) hotspots -->
<a class="hotspot wide-only" data-hotspot data-group="wide" data-name="Bigie" data-left="6.5" data-top="25.4" data-width="20.5" data-height="22.9"
   href="https://app.bigie.us/" aria-label="Bigie — live now"></a>
<a class="hotspot wide-only" data-hotspot data-group="wide" data-name="Bigie Lite" data-left="33.7" data-top="25.8" data-width="21.3" data-height="22.4"
   href="https://lite.bigie.us/" aria-label="Bigie Lite — live now"></a>
<a class="hotspot wide-only" data-hotspot data-group="wide" data-name="Car Riders" data-left="7" data-top="61.2" data-width="20.5" data-height="22.1"
   href="https://carriders.bigie.us/" aria-label="Car Riders — school pickup"></a>
<a class="hotspot wide-only" data-hotspot data-group="wide" data-name="Web Design" data-left="34.1" data-top="60.7" data-width="21" data-height="22.6"
   href="/web-design/" aria-label="Web Design — real sites, built"></a>
<button class="menu-hotspot hotspot wide-only" data-hotspot data-group="wide" data-name="Menu" data-left="87" data-top="3.5" data-width="8" data-height="7"
        id="menuTriggerWide" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
  <svg class="chalk-squiggle" viewBox="0 0 40 30">
    <path d="M2,5 Q10,2 18,5 T34,4" />
    <path d="M2,15 Q11,18 19,15 T35,16" />
    <path d="M2,25 Q10,22 18,25 T34,24" />
  </svg>
</button>

<!-- tall (narrow window / tablet / phone) hotspots -->
<a class="hotspot tall-only" data-hotspot data-group="tall" data-name="Bigie" data-left="19.4" data-top="12.2" data-width="61.2" data-height="9.5"
   href="https://app.bigie.us/" aria-label="Bigie — live now"></a>
<a class="hotspot tall-only" data-hotspot data-group="tall" data-name="Bigie Lite" data-left="19.4" data-top="24.5" data-width="61.2" data-height="9.5"
   href="https://lite.bigie.us/" aria-label="Bigie Lite — live now"></a>
<a class="hotspot tall-only" data-hotspot data-group="tall" data-name="Car Riders" data-left="19.4" data-top="37.5" data-width="61.2" data-height="9.5"
   href="https://carriders.bigie.us/" aria-label="Car Riders — school pickup"></a>
<a class="hotspot tall-only" data-hotspot data-group="tall" data-name="Web Design" data-left="19.4" data-top="50" data-width="61.2" data-height="9.5"
   href="/web-design/" aria-label="Web Design — real sites, built"></a>
<button class="menu-hotspot hotspot tall-only" data-hotspot data-group="tall" data-name="Menu" data-left="85" data-top="4" data-width="9" data-height="5"
        id="menuTriggerTall" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
  <svg class="chalk-squiggle" viewBox="0 0 40 30">
    <path d="M2,5 Q10,2 18,5 T34,4" />
    <path d="M2,15 Q11,18 19,15 T35,16" />
    <path d="M2,25 Q10,22 18,25 T34,24" />
  </svg>
</button>

<div class="menu-panel" id="menuPanel" hidden>
  <a href="https://app.bigie.us/">Bigie</a>
  <a href="https://lite.bigie.us/">Bigie Lite</a>
  <a href="https://carriders.bigie.us/">Car Riders</a>
  <a href="/web-design/">Web Design</a>
  <div class="menu-submenu">
    <div class="menu-submenu-label">Clients</div>
    <a href="/web-design/elements-salon/">Elements Salon</a>
    <a href="/web-design/made-by-madison/">Made by Madison</a>
  </div>
</div>

<script>
  const wideImg = document.querySelector('.board-photo.wide');
  const tallImg = document.querySelector('.board-photo.tall');
  const panel = document.getElementById('menuPanel');
  let activeTrigger = null;

  function activeImg() {
    return getComputedStyle(tallImg).display !== 'none' ? tallImg : wideImg;
  }
  function activeGroup() {
    return activeImg() === tallImg ? 'tall' : 'wide';
  }

  function positionHotspots() {
    const img = activeImg();
    const group = activeGroup();
    const vw = window.innerWidth, vh = window.innerHeight;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    if (!iw || !ih) return;
    const viewportRatio = vw / vh, imgRatio = iw / ih;
    // object-fit: cover -- scale to the LARGER dimension so the image
    // fills the viewport with no gaps, cropping the overflow axis.
    let scale, offsetX, offsetY;
    if (viewportRatio > imgRatio) {
      scale = vw / iw;
      offsetX = 0;
      offsetY = (ih * scale - vh) / 2;
    } else {
      scale = vh / ih;
      offsetY = 0;
      offsetX = (iw * scale - vw) / 2;
    }
    // Real bug, found 2026-09-17: at squarish viewports (e.g. a 1024x768
    // landscape tablet, or a narrowed desktop window) plain object-fit:
    // cover cropped deep enough into the wide board that the Bigie and
    // Car Riders boxes -- and their hotspots -- landed at a negative
    // on-screen position and became unclickable. Cap how much either
    // edge can be cropped; past that, shrink the zoom instead and let
    // the board-deep background show as a thin letterbox bar, and drive
    // the image's own position/size from this same math (replacing the
    // CSS object-fit) so it always lines up exactly with the hotspots.
    const MAX_CROP_FRACTION = 0.02;
    if (viewportRatio > imgRatio) {
      const maxOffsetY = ih * MAX_CROP_FRACTION * scale;
      if (offsetY > maxOffsetY) {
        scale = vh / (ih * (1 - 2 * MAX_CROP_FRACTION));
        offsetX = (iw * scale - vw) / 2;
        offsetY = ih * MAX_CROP_FRACTION * scale;
      }
    } else {
      const maxOffsetX = iw * MAX_CROP_FRACTION * scale;
      if (offsetX > maxOffsetX) {
        scale = vw / (iw * (1 - 2 * MAX_CROP_FRACTION));
        offsetY = (ih * scale - vh) / 2;
        offsetX = iw * MAX_CROP_FRACTION * scale;
      }
    }
    img.style.width = (iw * scale) + 'px';
    img.style.height = (ih * scale) + 'px';
    img.style.left = (-offsetX) + 'px';
    img.style.top = (-offsetY) + 'px';
    document.querySelectorAll(`[data-hotspot][data-group="${group}"]`).forEach(el => {
      const l = parseFloat(el.dataset.left) / 100 * iw;
      const t = parseFloat(el.dataset.top) / 100 * ih;
      const w = parseFloat(el.dataset.width) / 100 * iw;
      const h = parseFloat(el.dataset.height) / 100 * ih;
      el.style.left = (l * scale - offsetX) + 'px';
      el.style.top = (t * scale - offsetY) + 'px';
      el.style.width = (w * scale) + 'px';
      el.style.height = (h * scale) + 'px';
    });
    if (activeTrigger) positionMenuPanel(activeTrigger);
  }

  function positionMenuPanel(trigger) {
    const r = trigger.getBoundingClientRect();
    panel.style.top = (r.bottom + 8) + 'px';
    let left = r.right - panel.offsetWidth;
    left = Math.max(8, Math.min(left, window.innerWidth - panel.offsetWidth - 8));
    panel.style.left = left + 'px';
  }

  function ready() { return wideImg.complete && tallImg.complete; }
  if (ready()) positionHotspots();
  wideImg.addEventListener('load', positionHotspots);
  tallImg.addEventListener('load', positionHotspots);
  window.addEventListener('resize', positionHotspots);

  function toggleMenu(trigger) {
    const opening = panel.hasAttribute('hidden');
    if (opening) {
      activeTrigger = trigger;
      panel.removeAttribute('hidden');
      positionMenuPanel(trigger);
    } else {
      panel.setAttribute('hidden', '');
    }
    trigger.setAttribute('aria-expanded', String(opening));
  }

  const wideTrigger = document.getElementById('menuTriggerWide');
  const tallTrigger = document.getElementById('menuTriggerTall');
  [wideTrigger, tallTrigger].forEach(trigger => {
    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMenu(trigger);
    });
  });
  document.addEventListener('click', (e) => {
    if (!panel.hasAttribute('hidden') && !panel.contains(e.target) && e.target !== activeTrigger) {
      panel.setAttribute('hidden', '');
      if (activeTrigger) activeTrigger.setAttribute('aria-expanded', 'false');
    }
  });
</script>

</body>
</html>
