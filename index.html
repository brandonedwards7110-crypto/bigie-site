<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bigie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #16241b; --board-deep: #0e1912; --chalk: #f2f0e6; --chalk-dim: #c9cabb;
    --purple: #8b5fe0; --rose: #cf9186; --gold: #e0c26f; --teal: #7fc9b8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.025) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.02) 0, transparent 45%),
      radial-gradient(circle at 55% 15%, rgba(255,255,255,0.018) 0, transparent 35%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.008) 0 1px, transparent 1px 3px),
      linear-gradient(160deg, var(--board) 0%, var(--board-deep) 100%);
    color: var(--chalk);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 90px 24px 50px; text-align: center;
  }
  .caveat { font-family: "Caveat", cursive; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 22px 26px;
  }
  .nav-brand { font-family: "Caveat", cursive; font-size: 1.5rem; font-weight: 700; color: var(--chalk-dim); letter-spacing: 0.02em; }

  .hero-title {
    font-family: "Caveat", cursive; font-weight: 700; color: var(--chalk);
    font-size: clamp(4rem, 15vw, 8rem); line-height: 0.85; margin: 0;
    text-shadow: 0 0 1px rgba(242,240,230,0.4), 0 0 22px rgba(242,240,230,0.08);
    transform: rotate(-1.5deg);
  }
  .hero-sub {
    font-family: "Caveat", cursive; font-weight: 600; color: var(--chalk-dim);
    font-size: clamp(1.2rem, 3vw, 1.7rem); margin: 2px 0 0; transform: rotate(-0.8deg);
  }

  /* Hand-drawn chalk boxes -- irregular rounded corners + independent
     rotation per box so nothing lines up too perfectly, plus a rough
     double-stroke border to read as chalk, not a UI component. */
  .doors {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 26px;
    max-width: 640px; width: 100%; margin: 56px auto 0;
  }
  @media (min-width: 700px) {
    .doors { grid-template-columns: repeat(4, 1fr); max-width: 980px; }
  }
  .door {
    position: relative; text-decoration: none; color: var(--chalk);
    padding: 30px 16px 24px; min-height: 120px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    border: 2px solid var(--door-color, var(--chalk));
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .door::before {
    content: ''; position: absolute; inset: 5px;
    border: 1px solid var(--door-color, var(--chalk)); opacity: 0.35;
    border-radius: 15px 225px 15px 255px / 225px 15px 255px 15px;
    pointer-events: none;
  }
  .door:hover { background: rgba(242,240,230,0.05); transform: scale(1.03); }
  .door:nth-child(1) { --door-color: var(--purple); transform: rotate(-2deg); }
  .door:nth-child(2) { --door-color: var(--teal); transform: rotate(1.3deg); }
  .door:nth-child(3) { --door-color: var(--rose); transform: rotate(-1deg); }
  .door:nth-child(4) { --door-color: var(--gold); transform: rotate(1.8deg); }
  .door:hover:nth-child(1) { transform: rotate(-2deg) scale(1.04); }
  .door:hover:nth-child(2) { transform: rotate(1.3deg) scale(1.04); }
  .door:hover:nth-child(3) { transform: rotate(-1deg) scale(1.04); }
  .door:hover:nth-child(4) { transform: rotate(1.8deg) scale(1.04); }
  .door-label { font-family: "Caveat", cursive; font-weight: 700; font-size: 1.8rem; line-height: 1; }
  .door-tag {
    font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--chalk-dim); opacity: 0.8;
  }
  .door-tag.live { color: #8fe0a8; }

  footer {
    margin-top: 60px; color: rgba(242,240,230,0.35); font-size: 0.78rem; letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<nav>
  <span class="nav-brand">powered by bigie</span>
</nav>

<h1 class="hero-title">BIGIE</h1>
<p class="hero-sub">everything, in one place</p>

<div class="doors">
  <a class="door" href="https://app.bigie.us/">
    <span class="door-label">Bigie</span>
    <span class="door-tag live">Live now</span>
  </a>
  <a class="door" href="https://lite.bigie.us/">
    <span class="door-label">Bigie Lite</span>
    <span class="door-tag live">Live now</span>
  </a>
  <a class="door" href="https://carriders.bigie.us/">
    <span class="door-label">Car Riders</span>
    <span class="door-tag">School pickup</span>
  </a>
  <a class="door" href="/web-design/">
    <span class="door-label">Web Design</span>
    <span class="door-tag">Real sites, built</span>
  </a>
</div>

<footer>bigie.us</footer>

</body>
</html>
