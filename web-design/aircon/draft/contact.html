<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — AirCon Mechanical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0c1116; --steel: #16212c; --orange: #e0742f; --cream: #f2f0e6; --dim: #b9c2ca;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
  body { position: relative; isolation: isolate; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--cream); }
  a { color: inherit; }
  h1, h2, .brand, nav a { font-family: "Oswald", sans-serif; }

  .bg-blur {
    position: fixed; inset: 0; z-index: -2;
    background-image: url("assets/project-3.jpg"); background-size: cover; background-position: center;
    filter: blur(60px) brightness(0.5) saturate(1.15);
    transform: scale(1.2);
  }
  .bg-photo { position: fixed; inset: 0; z-index: -1; display: flex; align-items: center; justify-content: center; }
  .bg-photo img { max-width: 100%; max-height: 100%; object-fit: contain; opacity: 0.45; }
  .scrim { position: fixed; inset: 0; z-index: -1; background: rgba(12,17,22,0.6); }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 32px;
  }
  .brand { font-size: 1.15rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .brand span { color: var(--orange); }
  .nav-links { display: flex; gap: 28px; list-style: none; margin: 0; padding: 0; }
  .nav-links a {
    text-decoration: none; font-size: 0.86rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--dim); padding-bottom: 4px; border-bottom: 2px solid transparent;
  }
  .nav-links a:hover, .nav-links a.current { color: var(--cream); border-color: var(--orange); }
  .nav-toggle { display: none; background: none; border: 1px solid rgba(242,240,230,0.4); color: var(--cream); border-radius: 6px; padding: 8px 12px; font-size: 1.2rem; }

  main {
    position: relative; z-index: 1; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 90px 48px; text-align: center;
  }
  .wrap {
    max-width: 620px; background: rgba(12,17,22,0.6); border: 1px solid rgba(242,240,230,0.12);
    border-radius: 16px; padding: 56px 48px; backdrop-filter: blur(4px);
  }
  .eyebrow { color: var(--orange); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 14px; }
  h1 { font-size: clamp(1.8rem, 4.5vw, 2.6rem); font-weight: 700; margin: 0 0 20px; text-transform: uppercase; }
  .wrap p { color: var(--dim); font-size: 1.05rem; line-height: 1.7; margin: 0 0 10px; }
  .wrap a.phone {
    color: var(--orange); font-weight: 700; font-size: 2.4rem; text-decoration: none;
    display: inline-block; margin: 22px 0; letter-spacing: 0.01em;
  }
  .wrap a.phone:hover { color: var(--cream); }
  .loc { font-size: 0.95rem; color: var(--dim); }

  @media (max-width: 820px) {
    html, body { overflow-y: auto; height: auto; }
    .bg-blur, .bg-photo, .scrim { position: absolute; }
    nav { position: sticky; background: var(--ink); }
    .nav-links { display: none; }
    .nav-toggle { display: block; margin-left: auto; }
    main { padding: 90px 20px 60px; }
    .wrap { padding: 40px 28px; }
    .wrap a.phone { font-size: 1.9rem; }
  }
</style>
</head>
<body>

<div class="bg-blur"></div>
<div class="bg-photo"><img src="assets/project-3.jpg" alt=""></div>
<div class="scrim"></div>

<nav>
  <div class="brand">AirCon <span>Mechanical</span></div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="contact.html" class="current">Contact</a></li>
  </ul>
  <button class="nav-toggle" id="navToggle" aria-label="Menu">&#9776;</button>
</nav>

<main>
  <div class="wrap">
    <div class="eyebrow">Get In Touch</div>
    <h1>Contact Us</h1>
    <p>Commercial HVAC construction.</p>
    <a class="phone" href="tel:+13348873165">(334) 887-3165</a>
    <p class="loc">Auburn/Opelika, AL</p>
  </div>
</main>

<script>
  document.getElementById('navToggle').addEventListener('click', () => {
    const links = document.querySelector('.nav-links');
    links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
    links.style.flexDirection = 'column';
    links.style.position = 'absolute';
    links.style.top = '64px';
    links.style.right = '24px';
    links.style.background = 'var(--steel)';
    links.style.padding = '14px 20px';
    links.style.borderRadius = '8px';
    links.style.gap = '14px';
  });
</script>

</body>
</html>
