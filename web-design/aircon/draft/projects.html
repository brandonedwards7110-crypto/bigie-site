<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — AirCon Mechanical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0c1116; --steel: #16212c; --orange: #e0742f; --cream: #f2f0e6; --dim: #b9c2ca;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
  body { position: relative; isolation: isolate; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--cream); }
  a { color: inherit; }
  h1, h2, .brand, nav a { font-family: "Oswald", sans-serif; }

  .bg-blur {
    position: fixed; inset: 0; z-index: -2;
    background-image: url("assets/project-3.jpg"); background-size: cover; background-position: center;
    filter: blur(70px) brightness(0.4) saturate(1.1);
    transform: scale(1.2);
  }
  .scrim { position: fixed; inset: 0; z-index: -1; background: rgba(12,17,22,0.35); }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 32px;
  }
  .brand { font-size: 1.15rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .brand span { color: var(--orange); }
  .nav-links { display: flex; gap: 28px; list-style: none; margin: 0; padding: 0; }
  .nav-links a {
    text-decoration: none; font-size: 0.86rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--dim); padding-bottom: 4px; border-bottom: 2px solid transparent;
  }
  .nav-links a:hover, .nav-links a.current { color: var(--cream); border-color: var(--orange); }
  .nav-toggle { display: none; background: none; border: 1px solid rgba(242,240,230,0.4); color: var(--cream); border-radius: 6px; padding: 8px 12px; font-size: 1.2rem; }

  main {
    position: relative; z-index: 1; height: 100%; width: 100%;
    display: flex; flex-direction: column; justify-content: center;
    padding: 90px 48px 40px;
  }
  .heading { max-width: 700px; margin-bottom: 26px; }
  .eyebrow { color: var(--orange); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 10px; }
  h1 { font-size: clamp(1.8rem, 4.5vw, 2.6rem); font-weight: 700; margin: 0; text-transform: uppercase; }

  .grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; flex: 1; max-height: 55vh;
  }
  .card {
    position: relative; border-radius: 10px; overflow: hidden; border: 1px solid rgba(242,240,230,0.12);
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .label {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px;
    background: linear-gradient(0deg, rgba(12,17,22,0.9) 0%, transparent 100%);
    font-size: 0.85rem; font-weight: 600;
  }

  @media (max-width: 820px) {
    html, body { overflow-y: auto; height: auto; }
    .bg-blur, .scrim { position: absolute; }
    nav { position: sticky; background: var(--ink); }
    .nav-links { display: none; }
    .nav-toggle { display: block; margin-left: auto; }
    main { padding: 90px 20px 50px; }
    .grid { grid-template-columns: 1fr 1fr; max-height: none; }
    .card { aspect-ratio: 4/3; }
  }
</style>
</head>
<body>

<div class="bg-blur"></div>
<div class="scrim"></div>

<nav>
  <div class="brand">AirCon <span>Mechanical</span></div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="projects.html" class="current">Projects</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <button class="nav-toggle" id="navToggle" aria-label="Menu">&#9776;</button>
</nav>

<main>
  <div class="heading">
    <div class="eyebrow">Our Work</div>
    <h1>Recent Projects</h1>
  </div>
  <div class="grid">
    <div class="card"><img src="assets/project-1.jpg" alt="Project 1 placeholder"><div class="label">Project — placeholder</div></div>
    <div class="card"><img src="assets/project-2.jpg" alt="Project 2 placeholder"><div class="label">Project — placeholder</div></div>
    <div class="card"><img src="assets/project-3.jpg" alt="Project 3 placeholder"><div class="label">Project — placeholder</div></div>
    <div class="card"><img src="assets/project-4.jpg" alt="Project 4 placeholder"><div class="label">Project — placeholder</div></div>
  </div>
</main>

<script>
  document.getElementById('navToggle').addEventListener('click', () => {
    const links = document.querySelector('.nav-links');
    links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
    links.style.flexDirection = 'column';
    links.style.position = 'absolute';
    links.style.top = '64px';
    links.style.right = '24px';
    links.style.background = 'var(--steel)';
    links.style.padding = '14px 20px';
    links.style.borderRadius = '8px';
    links.style.gap = '14px';
  });
</script>

</body>
</html>
