<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AirCon Mechanical — Web Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --board-deep: #0e1912; --chalk: #f2f0e6; --chalk-dim: #c9cabb; --gold: #e0c26f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--board-deep);
    color: var(--chalk);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  a { color: inherit; }
  nav { padding: 22px 26px; display: flex; align-items: center; justify-content: space-between; }
  .nav-brand { font-family: "Caveat", cursive; font-size: 1.4rem; color: var(--chalk-dim); text-decoration: none; }
  .nav-back { font-size: 0.85rem; color: var(--chalk-dim); text-decoration: none; }
  .nav-back:hover { color: var(--chalk); }

  main { max-width: 560px; margin: 40px auto 0; padding: 0 24px 80px; text-align: center; }
  h1 { font-family: "Caveat", cursive; font-weight: 700; font-size: clamp(2.6rem, 7vw, 3.6rem); margin: 0; }
  .loc { color: var(--chalk-dim); font-size: 0.95rem; margin: 8px 0 40px; }

  .draft-box {
    display: block; text-decoration: none; color: var(--chalk);
    border: 1.5px dashed rgba(242,240,230,0.3); border-radius: 16px; padding: 36px 24px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .draft-box:hover { border-color: var(--gold); background: rgba(242,240,230,0.04); }
  .lock-icon { font-size: 1.8rem; margin-bottom: 10px; display: block; }
  .draft-label { font-family: "Caveat", cursive; font-weight: 700; font-size: 1.6rem; }
  .draft-note { font-size: 0.85rem; color: var(--chalk-dim); margin-top: 8px; line-height: 1.6; }

  .live-box {
    border-style: solid; border-color: var(--gold); border-width: 2px;
    padding: 40px 28px; margin-bottom: 24px;
  }
  .live-box:hover { background: rgba(224,194,111,0.08); }
  .live-box .lock-icon { font-size: 2.2rem; }
  .live-box .draft-label { font-size: 2rem; color: var(--gold); }
  .live-box .draft-note { font-size: 0.95rem; }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/">powered by bigie</a>
  <a class="nav-back" href="/web-design/">&larr; Web Design</a>
</nav>

<main>
  <h1>AirCon Mechanical</h1>
  <div class="loc">Auburn/Opelika, AL</div>

  <a class="draft-box live-box" href="http://airconal.com/" target="_blank" rel="noopener">
    <span class="lock-icon">&#9889;</span>
    <span class="draft-label">Live</span>
    <div class="draft-note">airconal.com — their current live site.</div>
  </a>

  <a class="draft-box" href="/web-design/aircon/draft/">
    <span class="lock-icon">&#128274;</span>
    <span class="draft-label">Drafts</span>
    <div class="draft-note">Password protected — internal review before anything replaces the live site.</div>
  </a>
</main>

</body>
</html>
